name: release

# IINA installs and updates plugins from the latest GitHub release, which must carry an
# .iinaplgz (a zip of the plugin folder's contents). Push a tag like v0.1.1 to publish one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test iina-plugin/test/*.test.js
      - name: Check the tag matches Info.json
        run: |
          v=$(node -p "require('./iina-plugin/watch-companion.iinaplugin/Info.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Info.json version $v"; exit 1; }
      - name: Pack
        run: |
          cd iina-plugin/watch-companion.iinaplugin
          zip -r -X "../../watch-companion-${GITHUB_REF_NAME#v}.iinaplgz" . -x '.*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" watch-companion-*.iinaplgz --title "$GITHUB_REF_NAME" --generate-notes
